name: Sync Upstream
run-name: >-
  ${{ github.event.inputs.mode == 'Single'
    && format('Sync {0}', github.event.inputs.single_target != ''
      && github.event.inputs.single_target
      || github.event.inputs.single_upstream)
    || 'Sync Upstream' }}

on:
  schedule:
    # 每天 北京时间 08:00（UTC 00:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '同步模式'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Single
      single_upstream:
        description: 'Single 模式：上游 HTTPS URL'
        required: false
        default: ''
        type: string
      single_target:
        description: 'Single 模式：目标仓库（可填 repo 名或 owner/repo；留空或仅填 repo 名时，自动拼成 github.repository_owner/repo）'
        required: false
        default: ''
        type: string

env:
  SYNC_REPO: ${{ github.repository_owner }}/sync
  SYNC_SUBDIR: .github
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      empty: ${{ steps.pick.outputs.empty }}
    steps:
      - name: 生成 App 令牌
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: 拉取私有同步仓库
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${SYNC_REPO}.git" /tmp/sync

      - name: 解析待同步仓库列表
        id: pick
        env:
          INPUT_MODE:     ${{ github.event.inputs.mode }}
          INPUT_UPSTREAM: ${{ github.event.inputs.single_upstream }}
          INPUT_TARGET:   ${{ github.event.inputs.single_target }}
          SYNC_SUBDIR:    ${{ env.SYNC_SUBDIR }}
        run: |
          set -euo pipefail
          CONFIG="/tmp/sync/${SYNC_SUBDIR}/sync-repos.json"

          MODE="${INPUT_MODE:-All}"
          echo "🎛️  同步模式：$MODE"

          if [ "$MODE" = "Single" ]; then
            if [ -z "${INPUT_UPSTREAM:-}" ]; then
              echo "::error::Single 模式必须填写 single_upstream"
              exit 1
            fi
            REPO_NAME="$(printf '%s' "$INPUT_UPSTREAM" \
              | sed -E 's#/+$##' \
              | sed -E 's#\.git$##' \
              | awk -F/ '{print $NF}')"

            TARGET="${INPUT_TARGET}"
            if [ -z "$TARGET" ]; then
              TARGET="${{ github.repository_owner }}/${REPO_NAME}"
              echo "ℹ️  single_target 未填，自动拼接：$TARGET"
            elif ! printf '%s' "$TARGET" | grep -q '/'; then
              TARGET="${{ github.repository_owner }}/${TARGET}"
              echo "ℹ️  single_target 仅填仓库名，自动补全：$TARGET"
            fi
            NAME="${TARGET##*/}"
            NORMALIZED="$(jq -cn \
              --arg name "$NAME" \
              --arg upstream "$INPUT_UPSTREAM" \
              --arg target "$TARGET" \
              '[{name:$name, upstream:$upstream, target:$target, branches:".*"}]')"
            echo "🧪 Single 模式："
            echo "$NORMALIZED" | jq -r '.[] | "   → \(.name)\t\(.upstream)  ->  \(.target)"'
            echo "empty=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":$NORMALIZED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [ -f "$CONFIG" ] || { echo "::error::找不到 $CONFIG"; exit 1; }

          DOW=$(date -u +%w)          # 0=周日, 1=周一 ... 6=周六
          DOM=$(date -u +%-d)         # 1-31
          echo "📅 今天 UTC：周 $DOW，$DOM 号"

          SELECTED="$(
            jq -c --arg dow "$DOW" --arg dom "$DOM" '
              [ .[]
                | select(.enabled != false)
                | (.frequency // "daily") as $f
                | if   ($f == "" or $f == "daily") then .
                  elif ($f | startswith("weekly:")) then
                    ($f | sub("^weekly:"; "") | split(",") | map(gsub("\\s"; ""))) as $days
                    | if ($days | index($dow)) then . else empty end
                  elif ($f | startswith("monthly:")) then
                    ($f | sub("^monthly:"; "") | split(",") | map(gsub("\\s"; ""))) as $days
                    | if ($days | index($dom)) then . else empty end
                  else .
                  end
              ]
            ' "$CONFIG"
          )"

          COUNT="$(echo "$SELECTED" | jq 'length')"

          if [ "$COUNT" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "⚠️ 今天没有需要同步的仓库"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            NORMALIZED="$(echo "$SELECTED" | jq -c 'map({
              name: .name,
              upstream: .upstream,
              target: .target,
              branches: (.branches // ".*")
            })')"
            echo "matrix={\"include\":$NORMALIZED}" >> "$GITHUB_OUTPUT"
            echo "📋 本次同步 $COUNT 个仓库"
            echo "$NORMALIZED" | jq -r '.[] | "   → \(.name)"'
          fi

  sync:
    needs: select
    if: ${{ needs.select.outputs.empty == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: Sync ${{ matrix.name }}
    steps:
      - name: 生成 App 令牌
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: 拉取私有同步仓库
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${SYNC_REPO}.git" /tmp/sync

      - name: 同步 ${{ matrix.name }}
        env:
          APP_TOKEN:      ${{ steps.app-token.outputs.token }}
          REPO_NAME:      ${{ matrix.name }}
          UPSTREAM:       ${{ matrix.upstream }}
          TARGET:         ${{ matrix.target }}
          BRANCH_PATTERN: ${{ matrix.branches }}
          SYNC_SUBDIR:    ${{ env.SYNC_SUBDIR }}
        run: bash "/tmp/sync/${SYNC_SUBDIR}/sync-branch-tags-release.sh"