name: Sync Upstream

on:
  schedule:
    # cron: '分 时 天 月 周'，第 5 个参数 1=周一，0/7=周日
    #- cron: '0 0 * * 1,3,5'
    # 每天 北京时间 08:00（UTC 00:00）
    - cron: '0 0 * * *'
    #- cron: '0 0 * * 1'
    #- cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '同步模式'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Test
      test_upstream:
        description: 'Test 模式：上游 HTTPS URL'
        required: false
        default: ''
        type: string
      test_target:
        description: 'Test 模式：目标 owner/repo'
        required: false
        default: ''
        type: string

env:
  SYNC_REPO: mrh5201314/sync
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      empty: ${{ steps.pick.outputs.empty }}
    steps:
      - name: 生成 App 令牌
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: 拉取私有同步仓库
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${SYNC_REPO}.git" /tmp/sync

      - name: 解析待同步仓库列表
        id: pick
        env:
          INPUT_MODE:     ${{ github.event.inputs.mode }}
          INPUT_UPSTREAM: ${{ github.event.inputs.test_upstream }}
          INPUT_TARGET:   ${{ github.event.inputs.test_target }}
        run: |
          set -euo pipefail
          CONFIG="/tmp/sync/sync-repos.json"

          MODE="${INPUT_MODE:-All}"
          echo "🎛️  同步模式：$MODE"

          if [ "$MODE" = "Test" ]; then
            if [ -z "${INPUT_UPSTREAM:-}" ] || [ -z "${INPUT_TARGET:-}" ]; then
              echo "::error::Test 模式必须同时填写 test_upstream 和 test_target"
              exit 1
            fi
            NAME="$(echo "$INPUT_TARGET" | awk -F/ '{print $NF}')"
            NORMALIZED="$(jq -cn \
              --arg name "$NAME" \
              --arg upstream "$INPUT_UPSTREAM" \
              --arg target "$INPUT_TARGET" \
              '[{name:$name, upstream:$upstream, target:$target, branches:".*"}]')"
            echo "🧪 Test 模式："
            echo "$NORMALIZED" | jq -r '.[] | "   → \(.name)\t\(.upstream)  ->  \(.target)"'
            echo "empty=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":$NORMALIZED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [ -f "$CONFIG" ] || { echo "::error::找不到 $CONFIG"; exit 1; }

          SELECTED="$(jq -c '[.[] | select(.enabled != false)]' "$CONFIG")"
          COUNT="$(echo "$SELECTED" | jq 'length')"

          if [ "$COUNT" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "⚠️ 没有启用的仓库"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            NORMALIZED="$(echo "$SELECTED" | jq -c 'map({
              name: .name,
              upstream: .upstream,
              target: .target,
              branches: (.branches // ".*")
            })')"
            echo "matrix={\"include\":$NORMALIZED}" >> "$GITHUB_OUTPUT"
            echo "📋 本次同步 $COUNT 个仓库"
            echo "$NORMALIZED" | jq -r '.[] | "   → \(.name)"'
          fi

  sync:
    needs: select
    if: ${{ needs.select.outputs.empty == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: Sync ${{ matrix.name }}
    steps:
      - name: 生成 App 令牌
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: 拉取私有同步仓库
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${SYNC_REPO}.git" /tmp/sync

      - name: 同步 ${{ matrix.name }}
        env:
          APP_TOKEN:      ${{ steps.app-token.outputs.token }}
          REPO_NAME:      ${{ matrix.name }}
          UPSTREAM:       ${{ matrix.upstream }}
          TARGET:         ${{ matrix.target }}
          BRANCH_PATTERN: ${{ matrix.branches }}
        run: bash /tmp/sync/sync-one.sh
