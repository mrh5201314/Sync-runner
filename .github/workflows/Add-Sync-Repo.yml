name: Add Sync Repo

on:
  workflow_dispatch:
    inputs:
      enable_clone:
        description: '启用克隆'
        required: false
        default: true
        type: boolean
      write_sync_config:
        description: '写入同步配置'
        required: false
        default: true
        type: boolean
      upstream:
        description: '上游 HTTPS URL（例：https://github.com/owner/repo.git）'
        required: true
        type: string
      name:
        description: '仓库名：留空=自动提取；repo=拼当前owner；owner/repo=直接使用'
        required: false
        default: ''
        type: string
      branches:
        description: '分支正则（留空默认 .*）'
        required: false
        default: '.*'
        type: string
      frequency:
        description: '同步频率：留空/daily=每天；weekly:1,3,5=周一三五；monthly:1,15=每月1和15号'
        required: false
        default: 'daily'
        type: string
      enabled:
        description: '启用同步'
        required: false
        default: true
        type: boolean

env:
  SYNC_REPO: ${{ github.repository_owner }}/sync
  SYNC_SUBDIR: .github
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  mirror-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 拉取私有同步仓库
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # depth 1 即可，后续如果需要提交，脚本内部会自动处理拉取/冲突
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${SYNC_REPO}.git" /tmp/sync

      - name: 执行镜像与配置
        env:
          GH_TOKEN:         ${{ secrets.GH_PAT }}
          TARGET_OWNER:     ${{ github.repository_owner }}
          INPUT_UPSTREAM:   ${{ inputs.upstream }}
          INPUT_NAME:       ${{ inputs.name }}
          INPUT_BRANCHES:   ${{ inputs.branches }}
          INPUT_FREQUENCY:  ${{ inputs.frequency }}
          INPUT_ENABLED:    ${{ inputs.enabled }}
          INPUT_CLONE:      ${{ inputs.enable_clone }}
          INPUT_WRITE_CONF: ${{ inputs.write_sync_config }}
          SYNC_SUBDIR:      ${{ env.SYNC_SUBDIR }}
        run: bash "/tmp/sync/${SYNC_SUBDIR}/Clone-and-AddSyncConfig.sh"