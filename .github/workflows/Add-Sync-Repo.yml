name: Add Sync Repo

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: '上游 HTTPS URL（例：https://github.com/owner/repo.git）'
        required: true
        type: string
      name:
        description: '仓库名（留空则自动从 upstream URL 中提取 repo 名）'
        required: false
        default: ''
        type: string
      branches:
        description: '分支正则（留空默认 .*）'
        required: false
        default: '.*'
        type: string
      frequency:
        description: '同步频率：留空/daily=每天；weekly:1,3,5=周一三五；monthly:1,15=每月1和15号'
        required: false
        default: 'daily'
        type: string
      enabled:
        description: '是否启用'
        required: false
        default: true
        type: boolean

env:
  SYNC_REPO: ${{ github.repository_owner }}/sync
  SYNC_SUBDIR: .github
  CONFIG_FILE: sync-repos.json
  TARGET_OWNER: ${{ github.repository_owner }}
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: 生成 App 令牌
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: 拉取私有同步仓库
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${SYNC_REPO}.git" /tmp/sync

      - name: 更新 sync-repos.json
        env:
          INPUT_NAME:      ${{ github.event.inputs.name }}
          INPUT_UPSTREAM:  ${{ github.event.inputs.upstream }}
          INPUT_BRANCHES:  ${{ github.event.inputs.branches }}
          INPUT_FREQUENCY: ${{ github.event.inputs.frequency }}
          INPUT_ENABLED:   ${{ github.event.inputs.enabled }}
          SYNC_SUBDIR:     ${{ env.SYNC_SUBDIR }}
          CONFIG_FILE:     ${{ env.CONFIG_FILE }}
        run: |
          set -euo pipefail
          CONFIG="/tmp/sync/${SYNC_SUBDIR}/${CONFIG_FILE}"
          [ -f "$CONFIG" ] || echo '[]' > "$CONFIG"

          # ---- 输入规范化 ----
          NAME="${INPUT_NAME}"
          UPSTREAM="${INPUT_UPSTREAM}"
          OWNER="${TARGET_OWNER}"
          BRANCHES="${INPUT_BRANCHES:-.*}"
          FREQUENCY="${INPUT_FREQUENCY:-}"
          ENABLED="${INPUT_ENABLED:-true}"

          # ---- 校验 upstream ----
          if ! printf '%s' "$UPSTREAM" | grep -qE '^https://'; then
            echo "::error::upstream 必须是 https:// 开头的 URL"
            exit 1
          fi

          # ---- 如果 name 留空，从 upstream URL 里提取 repo 名 ----
          if [ -z "$NAME" ]; then
            NAME="$(printf '%s' "$UPSTREAM" \
              | sed -E 's#/+$##' \
              | sed -E 's#\.git$##' \
              | awk -F/ '{print $NF}')"
            echo "ℹ️  name 未填，从 upstream 自动提取：$NAME"
          fi

          TARGET="${OWNER}/${NAME}"
          echo ">>> 目标：$TARGET"

          # ---- 校验 name ----
          if [ -z "$NAME" ]; then
            echo "::error::无法从 upstream 提取 repo 名，请手动填写 name"
            exit 1
          fi
          if ! printf '%s' "$NAME" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::name 只能包含字母数字._-（实际值：$NAME）"
            exit 1
          fi

          # ---- 校验 frequency ----
          if [ -n "$FREQUENCY" ] && [ "$FREQUENCY" != "daily" ]; then
            if ! printf '%s' "$FREQUENCY" | grep -qE '^(weekly|monthly):[0-9]+(,[0-9]+)*$'; then
              echo "::error::frequency 格式无效（实际值：$FREQUENCY）"
              echo "  正确格式：空/daily | weekly:1,3,5 | monthly:1,15"
              exit 1
            fi
          fi

#          echo ">>> 更新前共 $(jq 'length' "$CONFIG") 个："
#          jq -r '.[] | "   - \(.name)"' "$CONFIG"

          # ---- 构造新条目 ----
          NEW_ENTRY="$(jq -cn \
            --arg name      "$NAME" \
            --arg upstream  "$UPSTREAM" \
            --arg target    "$TARGET" \
            --arg branches  "$BRANCHES" \
            --arg frequency "$FREQUENCY" \
            --argjson enabled "$ENABLED" \
            '{name:$name, upstream:$upstream, target:$target, branches:$branches, frequency:$frequency, enabled:$enabled}')"

          # ---- upsert：先删同名，再追加 ----
          UPDATED="$(jq -c \
            --arg name "$NAME" \
            --argjson entry "$NEW_ENTRY" \
            'map(select(.name != $name)) + [$entry]' "$CONFIG")"

          printf '%s\n' "$UPDATED" | jq '.' > "$CONFIG"

#          echo ">>> 更新后共 $(jq 'length' "$CONFIG") 个："
#          jq -r '.[] | "   - \(.name)\t\(.upstream) -> \(.target)  [\(.frequency // "daily")]"' "$CONFIG"

      - name: 提交并推送
        env:
          SYNC_SUBDIR:     ${{ env.SYNC_SUBDIR }}
          CONFIG_FILE:     ${{ env.CONFIG_FILE }}
          INPUT_NAME:      ${{ github.event.inputs.name }}
          INPUT_UPSTREAM:  ${{ github.event.inputs.upstream }}
        run: |
          set -euo pipefail
          cd /tmp/sync

          CM_NAME="${INPUT_NAME}"
          if [ -z "$CM_NAME" ]; then
            CM_NAME="$(printf '%s' "$INPUT_UPSTREAM" \
              | sed -E 's#/+$##' \
              | sed -E 's#\.git$##' \
              | awk -F/ '{print $NF}')"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${SYNC_SUBDIR}/${CONFIG_FILE}"
          if git diff --cached --quiet; then
            echo "ℹ️ 内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(sync-repos): upsert $CM_NAME"
          git push
          echo "✅ 已提交并推送"